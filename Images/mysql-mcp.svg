<svg xmlns="http://www.w3.org/2000/svg" width="620" height="180" viewBox="0 0 620 180" font-family="Segoe UI, Arial, sans-serif">
  <rect width="620" height="180" fill="#ffffff"/>
  <rect x="20" y="60" width="140" height="60" rx="8" fill="#0b5fff" opacity="0.1" stroke="#0b5fff" stroke-width="2"/>
  <text x="90" y="95" text-anchor="middle" font-size="14" fill="#0b5fff">AI Agent</text>

  <rect x="240" y="60" width="160" height="60" rx="8" fill="#7a3ca0" opacity="0.1" stroke="#7a3ca0" stroke-width="2"/>
  <text x="320" y="88" text-anchor="middle" font-size="13" fill="#7a3ca0">MySQL MCP</text>
  <text x="320" y="106" text-anchor="middle" font-size="11" fill="#7a3ca0">(SQL query executor)</text>

  <rect x="480" y="60" width="120" height="60" rx="8" fill="#005a5a" opacity="0.1" stroke="#005a5a" stroke-width="2"/>
  <text x="540" y="88" text-anchor="middle" font-size="13" fill="#005a5a">MCP_DB</text>
  <text x="540" y="106" text-anchor="middle" font-size="11" fill="#005a5a">MySQL database</text>

  <line x1="160" y1="90" x2="235" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="400" y1="90" x2="475" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="197" y="80" text-anchor="middle" font-size="10" fill="#333">MCP tool call</text>
  <text x="437" y="80" text-anchor="middle" font-size="10" fill="#333">SELECT query</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
